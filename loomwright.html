<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loomwright — printed weave generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --g0:#08192C; --g1:#0E2338; --g2:#153048; --g3:#1C3D5C;
  --rule:#234A6E; --rule-2:#2E5C87;
  --ink:#E4EDF6; --dim:#9BB2CB; --faint:#657F9C;
  --warp:#59C6EF; --weft:#6FD3B0; --third:#B39BEA; --post:#F2A93C;
  --bad:#FF7A66; --ok:#6FD3B0;
  --r:4px; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--g0);color:var(--ink);
  font:450 13.5px/1.5 "IBM Plex Sans",system-ui,sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),
                   linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:40px 40px;opacity:.09}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:9px 16px;border-bottom:1px solid var(--rule);background:rgba(8,25,44,.9)}
.mark{font:600 16px/1 "IBM Plex Sans";letter-spacing:.01em}
.mark b{color:var(--post);font-weight:600}
.sub{font:400 10.5px/1 var(--mono);color:var(--faint);letter-spacing:.09em;text-transform:uppercase}
.presets{display:flex;gap:5px;flex-wrap:wrap;margin-left:auto}

/* ---------- buttons ---------- */
button{font:500 12px/1 var(--mono);color:var(--dim);cursor:pointer;background:var(--g2);
  border:1px solid var(--rule);border-radius:var(--r);padding:6px 10px;
  transition:background .12s,color .12s,border-color .12s}
button:hover{background:var(--g3);color:var(--ink)}
button[aria-pressed=true]{background:var(--warp);border-color:var(--warp);color:#06182B}
button:focus-visible{outline:2px solid var(--post);outline-offset:2px}
.wide{width:100%;justify-content:center;padding:10px}
.go{background:var(--post);border-color:var(--post);color:#2B1902;font-weight:600}
.go:hover{background:#FFBE5C;color:#2B1902}

/* ---------- layout ---------- */
main{flex:1;display:grid;grid-template-columns:274px minmax(0,1fr) 316px;min-height:0}
.rail{overflow-y:auto;padding:12px;scrollbar-width:thin}
.rail.l{border-right:1px solid var(--rule)}
.rail.r{border-left:1px solid var(--rule)}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0}

/* ---------- disclosure groups ---------- */
details{border-bottom:1px solid var(--rule);margin-bottom:2px}
details:last-of-type{border-bottom:0}
summary{list-style:none;cursor:pointer;padding:10px 2px;display:flex;align-items:center;gap:8px;
  font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font:500 13px/1 var(--mono);color:var(--rule-2);width:9px}
details[open]>summary::before{content:"–"}
summary:hover{color:var(--dim)}
summary:focus-visible{outline:2px solid var(--post);outline-offset:2px}
.body{padding:2px 2px 14px}
.hdr{font:600 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);padding:2px 0 9px;display:block}

/* ---------- fields ---------- */
.f{margin-bottom:12px}
.f .top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.f label{font-size:12.5px;color:var(--dim);flex:1}
.f .num{display:flex;align-items:baseline;gap:4px}
input[type=number]{width:62px;background:var(--g1);color:var(--ink);border:1px solid var(--rule);
  border-radius:var(--r);padding:3px 6px;font:500 12.5px/1.3 var(--mono);text-align:right}
input[type=number]:focus{outline:2px solid var(--post);outline-offset:0;border-color:var(--post)}
.u{font:400 10.5px/1 var(--mono);color:var(--faint);min-width:34px}
input[type=range]{width:100%;accent-color:var(--warp);height:14px;display:block}
.f.big label{font-size:14px;color:var(--ink);font-weight:500}
.f.big input[type=number]{width:74px;font-size:15px;padding:5px 7px}
.f.big{margin-bottom:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.g2 .f{margin-bottom:9px}
.g2 input[type=number]{width:100%}
.seg{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.seg button{flex:1 1 auto}

/* ---------- viewport ---------- */
.bar{display:flex;gap:6px;padding:9px 13px;border-bottom:1px solid var(--rule);
  flex-wrap:wrap;align-items:center}
.bar .mini{display:flex;align-items:center;gap:6px;font:400 11px/1 var(--mono);color:var(--faint)}
.bar .mini input[type=range]{width:76px}
.bar .sp{margin-left:auto;font:400 11px/1 var(--mono);color:var(--faint)}
.plate{flex:1;position:relative;min-height:0;
  background:radial-gradient(ellipse at 50% 42%,#11283F 0%,#071726 100%)}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
#view:active{cursor:grabbing}
#view:focus-visible{box-shadow:inset 0 0 0 2px var(--post)}
.legend{position:absolute;left:13px;bottom:11px;display:flex;gap:13px;flex-wrap:wrap;
  font:400 11px/1 var(--mono);color:var(--dim);pointer-events:none}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hint{position:absolute;right:13px;bottom:11px;font:400 10.5px/1 var(--mono);
  color:var(--faint);pointer-events:none}
.ordbar{position:absolute;left:13px;right:13px;bottom:34px;display:flex;
  align-items:center;gap:10px;pointer-events:none}
.ordbar input[type=range]{flex:1;pointer-events:auto;accent-color:var(--post);height:14px}
.ordbar output{font:400 11px/1 var(--mono);color:var(--dim);min-width:96px;text-align:right;
  background:rgba(8,25,44,.65);padding:3px 7px;border-radius:3px}

/* ---------- feasibility map ---------- */
.mapwrap{position:relative;margin-bottom:6px}
#map{display:block;width:100%;border:1px solid var(--rule);border-radius:var(--r);
  cursor:crosshair;background:#071726}
.maplab{display:flex;justify-content:space-between;font:400 10px/1 var(--mono);
  color:var(--faint);padding:4px 1px 0}
.readout{font:400 11px/1.5 var(--mono);color:var(--dim);min-height:18px}

/* ---------- gauges ---------- */
.gauge{margin-bottom:11px}
.gauge .gl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.gauge .gn{font-size:12.5px;color:var(--dim)}
.gauge .gv{font:500 12.5px/1 var(--mono)}
.track{position:relative;height:7px;border-radius:4px;background:var(--g2);overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:4px;transition:width .18s}
.thr{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ink);opacity:.55}
.gauge.bad .gv{color:var(--bad)} .gauge.bad .fill{background:var(--bad)}
.gauge.warn .gv{color:var(--post)} .gauge.warn .fill{background:var(--post)}
.gauge.ok .gv{color:var(--ok)} .gauge.ok .fill{background:var(--ok)}

/* ---------- numbers ---------- */
.m{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
  border-bottom:1px solid rgba(35,74,110,.45);font-size:12.5px}
.m:last-child{border-bottom:0}
.m span:first-child{color:var(--dim)}
.m span:last-child{font:500 12.5px/1 var(--mono)}
.m .d{color:var(--post);font-size:11px;margin-left:6px}

.flags{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.flag{font:400 11.5px/1.5 var(--mono);padding:8px 10px;border-radius:var(--r);
  border-left:2px solid var(--bad);background:rgba(255,122,102,.09);color:#FFC9BF}
.flag.a{border-left-color:var(--post);background:rgba(242,169,60,.09);color:#FFE0AE}

textarea{width:100%;background:#061525;color:var(--dim);border:1px solid var(--rule);
  border-radius:var(--r);font:400 11px/1.45 var(--mono);padding:8px;resize:vertical}
textarea:focus-visible{outline:2px solid var(--post);outline-offset:1px}
#draft{display:block;width:100%;background:#071726;border:1px solid var(--rule);
  border-radius:var(--r);cursor:crosshair}
.note{font:400 11px/1.5 var(--mono);color:var(--faint);margin-top:7px}

.tabs{display:none;gap:4px;padding:8px 12px;border-bottom:1px solid var(--rule)}
@media (max-width:1120px){
  main{grid-template-columns:258px minmax(0,1fr)}
  .rail.r{grid-column:1/-1;border-left:0;border-top:1px solid var(--rule);max-height:46vh}
}
@media (max-width:820px){
  .tabs{display:flex}
  main{grid-template-columns:1fr}
  .rail,.stage{display:none}
  .rail.on,.stage.on{display:flex;flex-direction:column}
  .rail.on{display:block;max-height:none;border:0}
  .plate{height:62vw;min-height:280px}
  main{overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <span class="mark">Loom<b>wright</b></span>
  <span class="sub">printed weave generator</span>
  <div class="presets" id="presets"></div>
</header>
<div class="tabs" id="tabs">
  <button data-tab="l" aria-pressed="false" style="flex:1">Design</button>
  <button data-tab="s" aria-pressed="true" style="flex:1">Preview</button>
  <button data-tab="r" aria-pressed="false" style="flex:1">Results</button>
</div>

<main>
  <section class="rail l on" id="pane-l" aria-label="Parameters"></section>

  <section class="stage on" id="pane-s" aria-label="Preview">
    <div class="bar">
      <div class="seg" id="vmode" style="margin:0">
        <button data-vm="fabric" aria-pressed="true">Fabric</button>
        <button data-vm="path" aria-pressed="false">Toolpath</button>
      </div>
      <div class="seg" id="vpre" style="margin:0">
        <button data-vp="iso">3/4</button><button data-vp="top">Top</button><button data-vp="side">Side</button>
      </div>
      <label class="mini">Z<input type="range" id="zx" min="1" max="10" step="1" value="3"><output id="zx_o">3×</output></label>
      <label class="mini">Shear<input type="range" id="shear" min="-30" max="30" step="1" value="0"><output id="shear_o">0°</output></label>
      <span class="sp" id="counts"></span>
    </div>
    <div class="plate">
      <canvas id="view" tabindex="0" aria-label="Fabric preview, arrow keys orbit"></canvas>
      <div class="legend" id="lgd"></div>
      <div class="hint">drag or arrows to orbit · scroll to zoom</div>
      <div class="ordbar">
        <input type="range" id="ord" min="0" max="1" step="1" value="1" aria-label="Print order scrub">
        <output id="ord_o">complete</output>
      </div>
    </div>
  </section>

  <section class="rail r" id="pane-r" aria-label="Results">
    <span class="hdr">Where this sits</span>
    <div class="mapwrap"><canvas id="map" height="230"></canvas></div>
    <div class="maplab"><span>pitch →</span><span id="mapro" class="readout"></span></div>
    <p class="note" id="mapnote"></p>

    <details open><summary>Constraints</summary><div class="body" id="gauges"></div></details>
    <details><summary>All numbers</summary><div class="body">
      <div id="mets"></div><div class="flags" id="flags"></div></div></details>
    <details><summary>Lift plan</summary><div class="body">
      <canvas id="draft" height="220"></canvas><p class="note" id="draftnote"></p></div></details>
    <details><summary>Output</summary><div class="body">
      <div class="seg" id="prsel">
        <button data-pr="generic" aria-pressed="true">Generic</button>
        <button data-pr="coreone" aria-pressed="false">Prusa Core One</button>
      </div>
      <button class="wide go" id="gen">Generate G-code</button>
      <div class="seg" style="margin-top:8px">
        <button id="dl">Download .gcode</button><button id="py">Export config</button>
      </div>
      <p class="note" id="outnote">Nothing generated yet.</p>
      <textarea id="out" rows="9" spellcheck="false" readonly aria-label="Generated output"></textarea>
      <span class="hdr" style="margin-top:14px">Start G-code</span>
      <textarea id="startg" rows="3" spellcheck="false"></textarea>
      <span class="hdr" style="margin-top:10px">End G-code</span>
      <textarea id="endg" rows="3" spellcheck="false"></textarea>
    </div></details>
  </section>
</main>
</div>

<script src="engine.js?v=6"></script>
<script>
"use strict";
/* UI for engine.js, which the script tag above loads first — geometry,
   op stream, metrics, gcode and report all live there, once. */

/* ==================================================================
 * CONTROLS — built from a spec so importance drives layout
 * ================================================================== */
const $=id=>document.getElementById(id);
/* process-only keys change no geometry: recompute metrics without a rebuild */
const PROC_KEYS=new Set(["ps","bs","ts","acc","pspd","pflow","ht","bt","fan","nflat","ncone"]);
const GROUPS=[
 {t:"Key dimensions",open:true,big:true,items:[
   {k:"pitch",l:"Pitch",u:"mm",min:1.5,max:8,st:0.05,dp:2},
   {k:"bd",l:"Button diameter",u:"mm",min:0.4,max:2.4,st:0.05,dp:2},
   {k:"bh",l:"Button height",u:"mm",min:0.25,max:1.4,st:0.05,dp:2}]},
 {t:"Weave",open:true,items:[
   {type:"seg",k:"lattice",o:[["biaxial","Biaxial"],["triaxial","Triaxial"]]},
   {type:"seg",k:"pattern",id:"patseg",
    o:[["plain","Plain"],["twill","2/2 twill"],["crepe","Crepe"],["satin","Satin"],["custom","Custom"]]},
   {type:"pair",items:[
     {k:"size",l:"Swatch",u:"mm",min:10,max:70,st:1,dp:0},
     {k:"rot",l:"Rotation",u:"°",min:0,max:90,st:1,dp:0}]}]},
 {t:"Mechanisms",items:[
   {type:"toggle",k:"edge",l:"Ground edges"},
   {type:"toggle",k:"join",l:"Selvedge U-turns"},
   {type:"toggle",k:"offd",l:"Offset dashes"},
   {type:"pair",items:[
     {k:"ovs",l:"Overshoot",u:"×",min:0,max:0.5,st:0.05,dp:2},
     {k:"offFrac",l:"Offset",u:"×",min:0.1,max:0.5,st:0.05,dp:2}]},
   {type:"pair",items:[
     {k:"plies",l:"Plies",u:"",min:1,max:3,st:1,dp:0},
     {k:"tack",l:"Tack every",u:"posts",min:0,max:8,st:1,dp:0}]},
   {type:"pair",items:[
     {k:"pgap",l:"Ply gap",u:"mm",min:0,max:0.8,st:0.05,dp:2},
     {k:"sw",l:"Strand width",u:"mm",min:0.15,max:0.8,st:0.01,dp:2}]},
   {type:"pair",items:[
     {k:"sh",l:"Layer height",u:"mm",min:0.05,max:0.4,st:0.01,dp:2}]}]},
 {t:"Nozzle",items:[
   {type:"pair",items:[
     {k:"nflat",l:"Tip flat",u:"mm",min:0.3,max:1.6,st:0.05,dp:2},
     {k:"ncone",l:"Cone angle",u:"°",min:40,max:140,st:5,dp:0}]},
   {type:"note",t:"Measure these on your own nozzle. The orifice does not set them — a fine nozzle can still have a blunt outer cone, and this pair decides the pitch floor."}]},
 {t:"Process",items:[
   {type:"pair",items:[
     {k:"ps",l:"Dash speed",u:"mm/m",min:300,max:9000,st:100,dp:0},
     {k:"bs",l:"Bridge speed",u:"mm/m",min:300,max:12000,st:100,dp:0}]},
   {type:"pair",items:[
     {k:"ts",l:"Travel speed",u:"mm/m",min:1000,max:20000,st:500,dp:0},
     {k:"acc",l:"Acceleration",u:"mm/s²",min:500,max:20000,st:500,dp:0}]},
   {type:"pair",items:[
     {k:"pspd",l:"Post feed",u:"mm/m",min:60,max:1200,st:20,dp:0},
     {k:"pflow",l:"Post flow",u:"×",min:0.6,max:2,st:0.05,dp:2}]},
   {type:"pair",items:[
     {k:"pstep",l:"Post steps",u:"",min:1,max:8,st:1,dp:0},
     {k:"fan",l:"Fan",u:"%",min:0,max:100,st:5,dp:0}]},
   {type:"pair",items:[
     {k:"ht",l:"Hotend",u:"°C",min:180,max:300,st:5,dp:0},
     {k:"bt",l:"Bed",u:"°C",min:0,max:120,st:5,dp:0}]}]},
];
function fieldHTML(it,big){
  return `<div class="f${big?" big":""}">
    <div class="top"><label for="${it.k}_n">${it.l}</label>
      <span class="num"><input type="number" id="${it.k}_n" min="${it.min}" max="${it.max}" step="${it.st}">
      <span class="u">${it.u}</span></span></div>
    ${big?`<input type="range" id="${it.k}_r" min="${it.min}" max="${it.max}" step="${it.st}">`:""}
  </div>`;
}
function buildControls(){
  $("pane-l").innerHTML = GROUPS.map((g,gi)=>{
    const body=g.items.map(it=>{
      if(it.type==="seg")
        return `<div class="seg" data-seg="${it.k}"${it.id?` id="${it.id}"`:""}>`+
          it.o.map(([v,l])=>`<button data-v="${v}">${l}</button>`).join("")+`</div>`;
      if(it.type==="toggle")
        return `<div class="seg"><button data-tog="${it.k}" style="flex:1">${it.l}</button></div>`;
      if(it.type==="pair")
        return `<div class="g2">`+it.items.map(x=>fieldHTML(x,false)).join("")+`</div>`;
      if(it.type==="note") return `<p class="note">${it.t}</p>`;
      return fieldHTML(it,g.big);
    }).join("");
    return `<details${g.open?" open":""}><summary>${g.t}</summary><div class="body">${body}</div></details>`;
  }).join("");

  GROUPS.forEach(g=>{
    const walk=items=>items.forEach(it=>{
      if(it.type==="pair") return walk(it.items);
      if(it.type||!it.k) return;
      const n=$(it.k+"_n"), r=$(it.k+"_r");
      const push=v=>{
        v=Math.max(it.min,Math.min(it.max,isNaN(v)?P[it.k]:v));
        P[it.k]=parseFloat(v.toFixed(it.dp+2));
        if(n) n.value=P[it.k].toFixed(it.dp);
        if(r) r.value=P[it.k];
        requestRecompute(!PROC_KEYS.has(it.k));
      };
      if(n) n.addEventListener("change",e=>push(parseFloat(e.target.value)));
      if(r) r.addEventListener("input",e=>push(parseFloat(e.target.value)));
    });
    walk(g.items);
  });
  $("pane-l").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    const seg=b.parentElement.dataset.seg;
    if(seg){ P[seg]=b.dataset.v; syncControls(); recompute(); }
    else if(b.dataset.tog){ P[b.dataset.tog]=!P[b.dataset.tog]; syncControls(); recompute(); }
  });
}
function syncControls(){
  GROUPS.forEach(g=>{
    const walk=items=>items.forEach(it=>{
      if(it.type==="pair") return walk(it.items);
      if(it.type||!it.k) return;
      const n=$(it.k+"_n"),r=$(it.k+"_r");
      if(n) n.value=Number(P[it.k]).toFixed(it.dp);
      if(r) r.value=P[it.k];
    });
    walk(g.items);
  });
  document.querySelectorAll("[data-seg]").forEach(s=>{
    const k=s.dataset.seg;
    s.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===P[k])));
  });
  document.querySelectorAll("[data-tog]").forEach(b=>
    b.setAttribute("aria-pressed",String(!!P[b.dataset.tog])));
  const ps=$("patseg");
  if(ps){ const off=P.lattice==="triaxial";
    ps.style.opacity=off?.35:1; ps.style.pointerEvents=off?"none":"auto"; }
}

/* ==================================================================
 * FEASIBILITY MAP — the surface you're actually navigating.
 * Lattice distances scale linearly with pitch, so once the geometry has been
 * solved once every cell is analytic. No rebuild per pixel.
 * ================================================================== */
const mapCv=$("map"), mcx=mapCv.getContext("2d");
const MAP={x0:1.5,x1:8,y0:0.4,y1:2.4};
let CONST=null;
function mapConst(m){
  return {k:m.gap/P.pitch, fl:(m.longest+P.bd)/P.pitch, s0:m.stops*P.pitch*P.pitch};
}
const cellClear=(p,bd)=>CONST.k*p - bd/2 - nozHalf();
const cellBridge=(p,bd)=>CONST.fl*p - bd;
const cellStops=p=>CONST.s0/(p*p);
function drawMap(){
  const w=mapCv.parentElement.clientWidth||280, h=230, dpr=window.devicePixelRatio||1;
  mapCv.style.height=h+"px"; mapCv.width=w*dpr; mapCv.height=h*dpr;
  mcx.setTransform(dpr,0,0,dpr,0,0); mcx.clearRect(0,0,w,h);
  if(!CONST) return;
  const NX=76,NY=52,cw=w/NX,ch=h/NY;
  let best=null;
  for(let ix=0;ix<NX;ix++) for(let iy=0;iy<NY;iy++){
    const p=MAP.x0+(ix+0.5)/NX*(MAP.x1-MAP.x0);
    const bd=MAP.y1-(iy+0.5)/NY*(MAP.y1-MAP.y0);
    const cl=cellClear(p,bd), br=cellBridge(p,bd);
    let fill;
    if(cl<0) fill="#0A1B2B";
    else if(br>4.5) fill="rgba(242,169,60,.16)";
    else{
      const s=cellStops(p);
      const nrm=Math.max(0,Math.min(1,(s-4)/26));      // more stops = dimmer
      const l=0.82-nrm*0.5;
      fill=`rgba(89,198,239,${l.toFixed(3)})`;
      if(!best||p<best.p) best={p,bd};
    }
    mcx.fillStyle=fill;
    mcx.fillRect(ix*cw,iy*ch,cw+0.6,ch+0.6);
  }
  // clearance boundary
  mcx.strokeStyle="rgba(255,122,102,.85)"; mcx.lineWidth=1.5; mcx.beginPath();
  let started=false;
  for(let ix=0;ix<=NX;ix++){
    const p=MAP.x0+ix/NX*(MAP.x1-MAP.x0);
    const bd=2*(CONST.k*p-nozHalf());                   // clearance == 0
    if(bd<MAP.y0-0.2||bd>MAP.y1+0.4){started=false;continue;}
    const X=ix*cw, Y=(MAP.y1-bd)/(MAP.y1-MAP.y0)*h;
    started?mcx.lineTo(X,Y):mcx.moveTo(X,Y); started=true;
  }
  mcx.stroke();
  // grid ticks
  mcx.strokeStyle="rgba(35,74,110,.55)"; mcx.lineWidth=1;
  mcx.font='9px "IBM Plex Mono"'; mcx.fillStyle="#657F9C";
  for(let p=2;p<=8;p++){
    const X=(p-MAP.x0)/(MAP.x1-MAP.x0)*w;
    mcx.beginPath();mcx.moveTo(X,h-5);mcx.lineTo(X,h);mcx.stroke();
    mcx.textAlign="center"; mcx.fillText(p,X,h-8);
  }
  for(let b=0.5;b<=2.4;b+=0.5){
    const Y=(MAP.y1-b)/(MAP.y1-MAP.y0)*h;
    mcx.beginPath();mcx.moveTo(0,Y);mcx.lineTo(5,Y);mcx.stroke();
    mcx.textAlign="left"; mcx.fillText(b.toFixed(1),7,Y-2);
  }
  // densest printable
  if(best){
    const X=(best.p-MAP.x0)/(MAP.x1-MAP.x0)*w, Y=(MAP.y1-best.bd)/(MAP.y1-MAP.y0)*h;
    mcx.strokeStyle="rgba(111,211,176,.9)";mcx.lineWidth=1;
    mcx.beginPath();mcx.arc(X,Y,5,0,6.2832);mcx.stroke();
    MAPBEST=best;
  } else MAPBEST=null;
  // current point
  const cX=(P.pitch-MAP.x0)/(MAP.x1-MAP.x0)*w, cY=(MAP.y1-P.bd)/(MAP.y1-MAP.y0)*h;
  mcx.strokeStyle="#fff";mcx.lineWidth=1.5;
  mcx.beginPath();mcx.moveTo(cX-8,cY);mcx.lineTo(cX-3,cY);
  mcx.moveTo(cX+3,cY);mcx.lineTo(cX+8,cY);
  mcx.moveTo(cX,cY-8);mcx.lineTo(cX,cY-3);
  mcx.moveTo(cX,cY+3);mcx.lineTo(cX,cY+8);mcx.stroke();
  mcx.beginPath();mcx.arc(cX,cY,2,0,6.2832);mcx.fillStyle="#fff";mcx.fill();
}
let MAPBEST=null;
function mapPick(ev,commit){
  const r=mapCv.getBoundingClientRect();
  const p=MAP.x0+Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*(MAP.x1-MAP.x0);
  const bd=MAP.y1-Math.max(0,Math.min(1,(ev.clientY-r.top)/r.height))*(MAP.y1-MAP.y0);
  if(commit){
    P.pitch=Math.round(p*20)/20; P.bd=Math.round(bd*20)/20;
    syncControls(); recompute(); return;
  }
  if(!CONST) return;
  const cl=cellClear(p,bd), br=cellBridge(p,bd);
  $("mapro").textContent=
    `${p.toFixed(2)} / ⌀${bd.toFixed(2)} · clr ${cl.toFixed(2)} · brg ${br.toFixed(1)} · ${cellStops(p).toFixed(0)}/cm²`;
}
mapCv.addEventListener("mousemove",e=>mapPick(e,false));
mapCv.addEventListener("mouseleave",()=>{$("mapro").textContent="";});
mapCv.addEventListener("click",e=>mapPick(e,true));

/* ==================================================================
 * gauges + numbers
 * ================================================================== */
function gauge(name,val,unit,lo,hi,thr,invert,dp){
  const frac=Math.max(0,Math.min(1,(val-lo)/(hi-lo)));
  const tf=Math.max(0,Math.min(1,(thr-lo)/(hi-lo)));
  let cls = invert ? (val>thr?"bad":(val>thr*0.85?"warn":"ok"))
                   : (val<thr?"bad":(val<thr*1.9?"warn":"ok"));
  return `<div class="gauge ${cls}">
    <div class="gl"><span class="gn">${name}</span><span class="gv">${val.toFixed(dp)} ${unit}</span></div>
    <div class="track"><div class="fill" style="width:${(frac*100).toFixed(1)}%"></div>
      <div class="thr" style="left:${(tf*100).toFixed(1)}%"></div></div></div>`;
}
let PIN=null;
function paint(m){
  $("gauges").innerHTML =
    gauge("Nozzle clearance",m.clear,"mm",-0.6,1.0,0.10,false,2)+
    gauge("Longest bridge",m.longest,"mm",0,9,4.5,true,2)+
    gauge("Vertical gap",m.vgap,"mm",0,0.7,0.08,false,2)+
    gauge("Stops per cm²",m.stops,"",0,40,26,true,1);

  const rows=[["Dashes",m.dashes,0],["Posts",m.posts,0],["Threads / inch",m.tpi,1],
    ["Areal coverage",m.cover*100,1,"%"],["Min viable pitch",m.minPitch,2," mm"],
    ["In-plane stretch",m.stretch*100,0,"%"],["Extrusion",m.ext,0," mm"],
    ["Est. print time",m.t/60,1," min"],["— in posts",m.fPost*100,0,"%"],
    ["— in travel",m.fTrav*100,0,"%"]];
  $("mets").innerHTML = rows.map(([k,v,dp,u=""])=>{
    let d="";
    if(PIN && PIN[k]!==undefined){
      const dv=v-PIN[k];
      if(Math.abs(dv)>Math.pow(10,-dp)/2) d=`<span class="d">${dv>0?"+":""}${dv.toFixed(dp)}</span>`;
    }
    return `<div class="m"><span>${k}</span><span>${v.toFixed(dp)}${u}${d}</span></div>`;
  }).join("");

  const F=[];
  if(m.clear<0) F.push(["b",`Nozzle clearance — the tip will clip posts. Needs pitch ≥ ${m.minPitch.toFixed(2)} mm, a smaller or shorter button, or a sharper nozzle.`]);
  else if(m.clear<0.10) F.push(["a",`Nozzle clearance — only ${m.clear.toFixed(2)} mm of margin. Verify against your actual nozzle.`]);
  if(m.vgap<0.08) F.push(["b","Vertical gap — bridges may weld to the layer below. Raise button height."]);
  if(m.longest>4.5) F.push(["a","Bridge span — expect droop. Shorten floats or reduce pitch."]);
  if(P.plies>1) F.push(["a","Two ply — clearance and bridge figures describe one ply. Ply 2 bridges over ply 1 rather than the bed; validate small first."]);
  if(m.dashes>4500) F.push(["a","Large model — preview and generation will be slow at this pitch and size."]);
  $("flags").innerHTML=F.map(([c,t])=>`<div class="flag ${c==='a'?'a':''}">${t}</div>`).join("");

  $("counts").textContent=`${m.dashes} dashes · ${m.posts} posts · ${m.ext.toFixed(0)} mm extruded`;
  $("mapnote").textContent = MAPBEST
    ? `Blue is printable, brighter is fewer stops. Red line is where the nozzle starts clipping; amber is bridge droop. Ring marks the densest printable point, ${MAPBEST.p.toFixed(2)} mm at ⌀${MAPBEST.bd.toFixed(2)}. Click to move there.`
    : "Nothing in this range is printable with the current button height and nozzle. Lower the button or sharpen the nozzle.";

  const lg = vmode==="path"
    ? [["lo","pass 1 — low"],["hi","pass 2 — bridge"],["p","post"],["t","travel"]]
    : P.lattice==="triaxial"
      ? [["f0","family A"],["f1","family B"],["f2","family C"],["p","post"]]
      : [["f0","weft"],["f1","warp"],["p","post"]];
  $("lgd").innerHTML=lg.map(([k,t])=>
    `<span><i style="background:${LGD[k]}"></i>${t}</span>`).join("");
}

/* ==================================================================
 * 3D view — fabric mode renders the predicted physical object: filament
 * tints per family, cylinder shading, cast shadows, cosmetic bridge droop,
 * round free-air bridges vs squished bed strands, taller pass-2 posts.
 * Toolpath mode stays a flat diagnostic of the commanded path.
 * ================================================================== */
const cv=$("view"), cx=cv.getContext("2d");
let az=0.62, el=0.5, zoom=1, vmode="fabric", zx=3, shear=0, W=600,H=400,S=1, TP=null;
const COL={lo:"#59C6EF",hi:"#6FD3B0",p:"#F2A93C",t:"rgba(155,178,203,.26)"};
const FAB={f0:[43,36,82],f1:[213,26,76],f2:[8,30,78],p:[36,64,58]};   // h,s,l
const LGD={lo:COL.lo,hi:COL.hi,p:COL.p,t:"#9BB2CB",
           f0:"hsl(43 36% 82%)",f1:"hsl(213 26% 76%)",f2:"hsl(8 30% 78%)"};
const LX=-0.615,LY=-0.788;                       // screen-space light, upper-left
const sh2=(x,y)=>[x+Math.tan(shear*Math.PI/180)*y,y];
function proj(x,y,z){
  const v=sh2(x,y);
  const cA=Math.cos(az),sA=Math.sin(az),cE=Math.cos(el),sE=Math.sin(el),oz=z*zx-0.4;
  return {x:W/2+S*(v[0]*-sA+v[1]*cA),
          y:H/2-S*(v[0]*-sE*cA+v[1]*-sE*sA+oz*cE),
          d:v[0]*cE*cA+v[1]*cE*sA+oz*sE};
}
function fitView(){
  const r=cv.parentElement.getBoundingClientRect();
  W=Math.max(200,r.width); H=Math.max(200,r.height);
  const dpr=window.devicePixelRatio||1;
  cv.width=W*dpr; cv.height=H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
  S=Math.min(W,H)/(P.size*1.3)*zoom;
  render();
}
function drawOutline(){
  if(vmode==="fabric"){
    const c0=proj(0,0,0), R=Math.max(40,P.size*S*0.9);
    const g=cx.createRadialGradient(c0.x,c0.y,R*0.15,c0.x,c0.y,R);
    g.addColorStop(0,"rgba(30,55,80,.32)");g.addColorStop(1,"rgba(30,55,80,0)");
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
  }
  const h=P.size/2,a=P.rot*Math.PI/180;
  const corner=[[-h,-h],[h,-h],[h,h],[-h,h]].map(c=>
    proj(c[0]*Math.cos(a)-c[1]*Math.sin(a), c[0]*Math.sin(a)+c[1]*Math.cos(a), 0));
  cx.strokeStyle="rgba(35,74,110,.9)"; cx.lineWidth=1; cx.beginPath();
  corner.forEach((p,i)=>i?cx.lineTo(p.x,p.y):cx.moveTo(p.x,p.y)); cx.closePath(); cx.stroke();
}
function mkSeg(a,az_,b,bz,k,fam,lw,shadow){
  const A=proj(a[0],a[1],az_),B=proj(b[0],b[1],bz);
  return {a,b,A,B,d:(A.d+B.d)/2,k,fam,lw,shadow};
}
function renderPath(){
  const items=[];
  const N=showN<0?TP.segs.length:showN;
  for(let i2=0;i2<N;i2++){
    const s=TP.segs[i2];
    const A=proj(s.a[0],s.a[1],s.az), B=proj(s.b[0],s.b[1],s.bz);
    items.push({A,B,d:(A.d+B.d)/2,k:s.k});
  }
  items.sort((a,b)=>a.d-b.d);
  cx.lineCap="round";
  const lw=Math.max(1.3,P.sw*S);
  for(const it of items){
    cx.strokeStyle=it.k==="t"?COL.t:COL[it.k]||COL.p;
    cx.lineWidth=it.k==="t"?1:it.k==="p"?Math.max(1.3,P.bd*0.45*S):lw;
    cx.beginPath();cx.moveTo(it.A.x,it.A.y);cx.lineTo(it.B.x,it.B.y);cx.stroke();
  }
}
function drawPost(it,fog){
  const rx=Math.max(1.2,P.bd/2*S), ry=rx*Math.abs(Math.sin(el));
  const rb=rx*1.16, ryb=ry*1.16;   // volume-conserving base spread onto the dash
  const b=proj(it.post[0],it.post[1],it.dz), t=proj(it.post[0],it.post[1],it.dz+it.ph);
  const l=Math.min(66,FAB.p[2]*fog);
  const g=cx.createLinearGradient(b.x-rb,0,b.x+rb,0);
  g.addColorStop(0,`hsl(${FAB.p[0]} ${FAB.p[1]}% ${(l*0.60).toFixed(1)}%)`);
  g.addColorStop(0.35,`hsl(${FAB.p[0]} ${FAB.p[1]}% ${l.toFixed(1)}%)`);
  g.addColorStop(1,`hsl(${FAB.p[0]} ${FAB.p[1]}% ${(l*0.66).toFixed(1)}%)`);
  cx.beginPath();
  for(let k=0;k<=10;k++){const a=-Math.PI/2+k/10*Math.PI;cx.lineTo(b.x+rb*Math.sin(a),b.y+ryb*Math.cos(a));}
  for(let k=10;k>=0;k--){const a=-Math.PI/2+k/10*Math.PI;cx.lineTo(t.x+rx*Math.sin(a),t.y+ry*Math.cos(a));}
  cx.closePath();cx.fillStyle=g;cx.fill();
  cx.beginPath();
  for(let k=0;k<=16;k++){const a=k/16*6.2832;cx.lineTo(t.x+rx*Math.sin(a),t.y+ry*Math.cos(a));}
  cx.closePath();
  cx.fillStyle=`hsl(${FAB.p[0]} ${Math.min(100,FAB.p[1]+6)}% ${Math.min(74,l*1.2).toFixed(1)}%)`;
  cx.fill();
}
function renderFabric(){
  const dfree=Math.sqrt(4*P.sw*P.sh/Math.PI);
  const lwLo=Math.max(1.4,P.sw*S), lwHi=Math.max(1.2,dfree*S);
  const items=[];
  const add=(seg,zk)=>{seg.zk=zk;items.push(seg);};
  // op z values are nozzle-tip heights; the deposited strand hangs below the
  // tip, so draw centrelines sh/2 lower — bridges then rest on the button
  // tops instead of floating a layer above them. Bridges render straight:
  // actual droop is unmeasured (NOTES § 5).
  const cz=P.sh/2;
  const N=showN<0?TP.segs.length:showN;
  for(let i2=0;i2<N;i2++){
    const s=TP.segs[i2];
    if(s.k==="t") continue;
    const zk=(s.az+s.bz)/2;
    if(s.k==="hi") add(mkSeg(s.a,s.az-cz,s.b,s.bz-cz,"hi",s.fam,lwHi,true),zk);
    else if(s.k==="p") add(mkSeg(s.a,s.az-cz,s.b,s.bz-cz,"p",undefined,Math.max(1.3,P.bd*0.42*S),false),zk);
    else add(mkSeg(s.a,s.az-cz,s.b,s.bz-cz,"lo",s.fam,lwLo,s.az>P.bh),zk);
  }
  const seen=new Set();
  for(let ply=0;ply<P.plies;ply++){
    const shift=(ply%2)?P.pitch/2:0, dz=plyDz(ply);
    for(const D of TP.ds){
      if(!D.post) continue;
      const key=ply+":"+D.L.f+":"+D.L.i+":"+D.pb.toFixed(3);
      if(seen.has(key)) continue; seen.add(key);
      if(showN>=0&&((TP.seq?.[key])??0)>showN) continue;   // post not built yet here
      const c=place(postC(D),shift);
      // contact anchoring: with exaggerated z the strand's drawn thickness
      // cannot span the tip-to-top distance, so the barrel is drawn up to
      // the strand centreline plane (bh + sh/2) and the extension hides
      // under the bridge resting on it. Physical post top stays bh — the
      // G-code is untouched by any of this (NOTES §2.4).
      const ph=P.bh+P.sh/2;
      items.push({post:c,dz,ph,zk:dz+P.bh/2,d:proj(c[0],c[1],dz+P.bh/2).d});
    }
  }
  // shadow pass: anything airborne casts onto the bed
  cx.lineCap="round";
  for(const it of items){
    if(it.post){
      const b=proj(it.post[0],it.post[1],0);
      const rx=Math.max(1.4,P.bd/2*S*1.2), ry=rx*Math.abs(Math.sin(el))+1;
      cx.beginPath();cx.ellipse(b.x,b.y,rx,ry,0,0,6.2832);
      cx.fillStyle="rgba(2,8,18,.26)";cx.fill();
    } else if(it.shadow){
      const A=proj(it.a[0],it.a[1],0),B=proj(it.b[0],it.b[1],0);
      cx.strokeStyle="rgba(2,8,18,.15)";cx.lineWidth=it.lw*1.3;
      cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(B.x,B.y);cx.stroke();
    }
  }
  // painter order: physical z-band first (lows → posts → bridges → next ply),
  // view depth only within a band — plain view-depth midpoint sorting lets
  // plan position swamp the sub-millimetre z structure, so over/under at
  // crossings would flip as you orbit
  items.sort((a,b)=>(a.zk-b.zk)||(a.d-b.d));
  const n=items.length, hl=n<9000;
  for(let i=0;i<n;i++){
    const it=items[i], fog=0.86+0.2*(n>1?i/(n-1):1);
    if(it.post){ drawPost(it,fog); continue; }
    // cylinder-ish shading: brightest when the strand runs across the light
    const dx=it.B.x-it.A.x,dy=it.B.y-it.A.y,Ln=Math.hypot(dx,dy)||1;
    const f=Math.abs((dx/Ln)*LY-(dy/Ln)*LX);
    const shade=(0.62+0.38*f)*fog;
    const t=it.k==="p"?FAB.p:FAB["f"+(it.fam??0)];
    cx.strokeStyle=`hsl(${t[0]} ${t[1]}% ${Math.min(92,t[2]*shade).toFixed(1)}%)`;
    cx.lineWidth=it.lw;
    cx.beginPath();cx.moveTo(it.A.x,it.A.y);cx.lineTo(it.B.x,it.B.y);cx.stroke();
    if(hl&&it.lw>2.2&&it.k!=="p"){
      const px=-dy/Ln,py=dx/Ln,sgn=(px*LX+py*LY)<0?1:-1;   // toward the light
      // deposition profile drives the sheen: free-air roads are round
      // (tight bright specular), supported roads are squished flat
      // (broad faint sheen) — volume-conservation geometry, NOTES §2.4
      const round_=it.k==="hi";
      const off=it.lw*(round_?0.22:0.12)*sgn;
      cx.strokeStyle=`rgba(255,255,255,${(round_?0.12+0.20*f:0.05+0.09*f).toFixed(3)})`;
      cx.lineWidth=it.lw*(round_?0.28:0.52);
      cx.beginPath();cx.moveTo(it.A.x+px*off,it.A.y+py*off);
      cx.lineTo(it.B.x+px*off,it.B.y+py*off);cx.stroke();
    }
  }
}
function drawScaleBar(){
  const px=10*S;
  if(px>18&&px<W*0.6){
    cx.strokeStyle="rgba(155,178,203,.6)";cx.lineWidth=1;
    cx.beginPath();cx.moveTo(14,H-62);cx.lineTo(14+px,H-62);
    cx.moveTo(14,H-66);cx.lineTo(14,H-58);cx.moveTo(14+px,H-66);cx.lineTo(14+px,H-58);
    cx.stroke();
    cx.fillStyle="rgba(155,178,203,.7)";cx.font='10px "IBM Plex Mono"';cx.textAlign="left";
    cx.fillText("10 mm",14,H-70);
  }
}
function render(){
  cx.clearRect(0,0,W,H);
  if(!TP) return;
  drawOutline();
  if(vmode==="path") renderPath(); else renderFabric();
  drawScaleBar();
  if(showN>0&&TP.segs.length){
    // the nozzle at the scrub point (tip coordinates — it is the machine)
    const sN=TP.segs[Math.min(showN,TP.segs.length)-1];
    const hp=proj(sN.b[0],sN.b[1],sN.bz);
    cx.strokeStyle="#fff";cx.lineWidth=1.5;
    cx.beginPath();cx.arc(hp.x,hp.y,5,0,6.2832);cx.stroke();
    cx.beginPath();cx.arc(hp.x,hp.y,1.5,0,6.2832);cx.fillStyle="#fff";cx.fill();
  }
}

/* ==================================================================
 * draft — a lift plan is a bitmap, and here it's editable
 * ================================================================== */
const dc=$("draft"), dcx=dc.getContext("2d");
function drawDraft(){
  const w=dc.parentElement.clientWidth||260, dpr=window.devicePixelRatio||1;
  const N=P.pattern==="custom"?P.draft.length:12;
  dc.style.height=w+"px"; dc.width=w*dpr; dc.height=w*dpr;
  dcx.setTransform(dpr,0,0,dpr,0,0); dcx.clearRect(0,0,w,w);
  const note=$("draftnote");
  if(P.lattice==="triaxial"){
    dcx.fillStyle="#657F9C";dcx.font='12px "IBM Plex Mono"';dcx.textAlign="center";
    dcx.fillText("no lift plan",w/2,w/2-9);
    dcx.fillText("A over B over C over A",w/2,w/2+11);
    note.textContent="Triaxial uses a cyclic rule instead of a draft, which gives every thread a perfect alternating sequence for free.";
    return;
  }
  const c=w/N, rule=liftRule();
  for(let i=0;i<N;i++) for(let j=0;j<N;j++){
    dcx.fillStyle=rule(i,j)?"#59C6EF":"#11283F";
    dcx.fillRect(i*c+0.5,j*c+0.5,c-1,c-1);
  }
  dcx.strokeStyle="rgba(35,74,110,.8)";dcx.lineWidth=1;
  for(let k=0;k<=N;k++){
    dcx.beginPath();dcx.moveTo(k*c,0);dcx.lineTo(k*c,w);dcx.stroke();
    dcx.beginPath();dcx.moveTo(0,k*c);dcx.lineTo(w,k*c);dcx.stroke();
  }
  note.textContent = P.pattern==="custom"
    ? "Click a square to flip it. Filled means warp over — the pattern is just this bitmap, which is why arbitrary jacquard figuring costs nothing here."
    : "Filled squares are warp over weft. Switch to Custom to draw your own.";
}
dc.addEventListener("click",ev=>{
  if(P.pattern!=="custom") return;
  const r=dc.getBoundingClientRect(), c=r.width/P.draft.length;
  const i=Math.floor((ev.clientX-r.left)/c), j=Math.floor((ev.clientY-r.top)/c);
  if(i<0||j<0||i>=P.draft.length||j>=P.draft.length) return;
  P.draft[j][i]=P.draft[j][i]?0:1; recompute();
});

/* ==================================================================
 * wiring
 * ================================================================== */
let lastG=null, rafId=0, rafFull=false, showN=-1;
function doRecompute(full){
  if(full||!TP){
    TP=toolpath();
    showN=-1;                      // parameters changed: show the finished object
    const o=$("ord");o.max=TP.segs.length;o.value=TP.segs.length;
    $("ord_o").textContent="complete";
  }
  const m=metrics(TP);
  CONST=mapConst(m);
  drawMap(); paint(m);
  if(full){ drawDraft(); fitView(); }
  lastG=null;
  $("outnote").textContent="Parameters changed — generate again.";
}
function requestRecompute(full){
  rafFull=rafFull||full;
  if(!rafId) rafId=requestAnimationFrame(()=>{const f=rafFull;rafId=0;rafFull=false;doRecompute(f);});
}
function recompute(){ doRecompute(true); }
$("vmode").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  vmode=b.dataset.vm;
  document.querySelectorAll("#vmode button").forEach(x=>
    x.setAttribute("aria-pressed",String(x.dataset.vm===vmode)));
  paint(metrics(TP)); render();
});
$("vpre").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  const v=b.dataset.vp;
  if(v==="iso"){az=0.62;el=0.5;} if(v==="top"){az=0;el=1.52;} if(v==="side"){az=0;el=0.04;}
  render();
});
$("zx").addEventListener("input",e=>{zx=+e.target.value;$("zx_o").textContent=zx+"×";render();});
$("shear").addEventListener("input",e=>{shear=+e.target.value;$("shear_o").textContent=shear+"°";render();});
$("ord").addEventListener("input",e=>{
  const v=+e.target.value,max=+e.target.max;
  showN=v>=max?-1:v;
  $("ord_o").textContent=showN<0?"complete":`${v} / ${max}`;
  render();
});
let drag=false,lx=0,ly=0;
const dn=e=>{drag=true;const t=e.touches?e.touches[0]:e;lx=t.clientX;ly=t.clientY;};
const mv=e=>{
  if(!drag) return; e.preventDefault();
  const t=e.touches?e.touches[0]:e;
  az-=(t.clientX-lx)*0.01; el=Math.max(-0.05,Math.min(1.53,el+(t.clientY-ly)*0.01));
  lx=t.clientX; ly=t.clientY; render();
};
cv.addEventListener("mousedown",dn); window.addEventListener("mousemove",mv);
window.addEventListener("mouseup",()=>drag=false);
cv.addEventListener("touchstart",dn,{passive:true});
cv.addEventListener("touchmove",mv,{passive:false});
cv.addEventListener("touchend",()=>drag=false);
cv.addEventListener("wheel",e=>{
  e.preventDefault(); zoom=Math.max(0.3,Math.min(6,zoom*(e.deltaY<0?1.1:0.909))); fitView();
},{passive:false});
cv.addEventListener("keydown",e=>{
  const k={ArrowLeft:[-.08,0],ArrowRight:[.08,0],ArrowUp:[0,-.06],ArrowDown:[0,.06]}[e.key];
  if(!k) return; e.preventDefault();
  az+=k[0]; el=Math.max(-0.05,Math.min(1.53,el+k[1])); render();
});

function setOut(t,l){ $("out").value=t; $("outnote").textContent=l; }
const genG=()=>gcode(TP,$("startg").value.trim(),$("endg").value.trim());
$("gen").addEventListener("click",()=>{
  if(!TP) recompute();
  lastG=genG();
  const kb=(new Blob([lastG]).size/1024).toFixed(1);
  setOut(lastG,`${lastG.split("\n").length} lines · ${kb} KB. Select all to copy, or download.`);
});
function save(text,name,type){
  try{
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([text],{type}));
    a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }catch(err){ setOut(text,"Download blocked here — select all in this box and copy instead."); }
}
$("dl").addEventListener("click",()=>{
  if(!lastG){ if(!TP) recompute(); lastG=genG(); }
  save(lastG,`loomwright_${P.lattice}_${P.pattern}_${P.pitch}mm.gcode`,"text/plain");
});
$("py").addEventListener("click",()=>{
  const t=JSON.stringify(P,null,2)+"\n";
  setOut(t,"Everything the engine needs. CLI: bun engine.js --config loomwright_config.json --report · FullControl plot/profiles: python fcexport.py loomwright_config.json --plot");
  save(t,"loomwright_config.json","application/json");
});

const PRESETS={
  "Validated":{lattice:"biaxial",pattern:"twill",pitch:3.6,bd:0.9,bh:0.45,offd:false,plies:1,size:30},
  "Dense":{lattice:"biaxial",pattern:"plain",pitch:2.6,bd:0.7,bh:0.35,offd:false,plies:1,size:26},
  "Stretch":{lattice:"biaxial",pattern:"plain",pitch:3.8,bd:1.8,bh:0.5,offd:true,plies:1,size:30},
  "Triaxial":{lattice:"triaxial",pattern:"twill",pitch:6.8,bd:0.9,bh:0.45,offd:false,plies:1,size:34},
  "Two ply":{lattice:"biaxial",pattern:"twill",pitch:3.6,bd:0.9,bh:0.45,offd:false,plies:2,tack:3,size:26},
};
$("presets").innerHTML=Object.keys(PRESETS).map(k=>`<button data-p="${k}">${k}</button>`).join("")
  +`<button id="pin" title="Pin current numbers to compare against">Pin</button>`;
$("presets").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.id==="pin"){
    const m=metrics(TP);
    PIN = PIN ? null : {"Dashes":m.dashes,"Posts":m.posts,"Threads / inch":m.tpi,
      "Areal coverage":m.cover*100,"Min viable pitch":m.minPitch,
      "In-plane stretch":m.stretch*100,"Extrusion":m.ext,"Est. print time":m.t/60,
      "— in posts":m.fPost*100,"— in travel":m.fTrav*100};
    b.setAttribute("aria-pressed",String(!!PIN)); paint(m); return;
  }
  Object.assign(P,PRESETS[b.dataset.p]); syncControls(); recompute();
});

$("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  ["l","s","r"].forEach(t=>$("pane-"+t).classList.toggle("on",t===b.dataset.tab));
  document.querySelectorAll("#tabs button").forEach(x=>
    x.setAttribute("aria-pressed",String(x===b)));
  if(b.dataset.tab==="s") fitView();
  if(b.dataset.tab==="r"){ drawMap(); drawDraft(); }
});

$("prsel").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  P.printer=b.dataset.pr;
  P.bed=printerDef().bed.slice();
  $("startg").value=printerDef().start();
  $("endg").value=printerDef().end();
  document.querySelectorAll("#prsel button").forEach(x=>
    x.setAttribute("aria-pressed",String(x.dataset.pr===P.printer)));
  lastG=null;
  $("outnote").textContent=P.printer==="coreone"
    ? "Core One profile: model check, area-limited G29, purge. Send over LAN: python print.py file.gcode --host <printer-ip> --key <PrusaLink key> --go"
    : "Parameters changed — generate again.";
});
$("startg").value=printerDef().start();
$("endg").value=printerDef().end();
window.addEventListener("resize",()=>{drawMap();drawDraft();fitView();});
buildControls(); syncControls(); recompute();
</script>
</body>
</html>
